<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Scout</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Times New Roman"', 'Times', 'serif'],
            },
          },
        },
      }
    </script>

    <!-- CRITICAL: Polyfills and Error Handling -->
    <script>
        // 1. Safe Polyfill for process.env
        if (typeof window !== 'undefined') {
            if (!window.process) {
                window.process = { env: {} };
            } else if (!window.process.env) {
                window.process.env = {};
            }
        }

        // 2. Global Error Handler
        window.onerror = function(message, source, lineno, colno, error) {
            console.error("Critical Startup Error:", message);
            const root = document.getElementById('root');
            if (root && root.innerHTML.includes('Loading Game Scout')) {
                 root.innerHTML = `
                    <div style="color: #ef4444; background: #1a1a1a; padding: 2rem; font-family: monospace; border: 1px solid #ef4444; margin: 2rem auto; border-radius: 0.5rem; max-width: 600px; text-align: left;">
                        <h2 style="font-size: 1.5rem; margin-bottom: 1rem; font-weight: bold;">Initialization Error</h2>
                        <p><strong>Error:</strong> ${message}</p>
                        <p><strong>Source:</strong> Line ${lineno}</p>
                        <p style="margin-top: 1rem; color: #999;">Check if a CDN (esm.sh) is blocked by your network.</p>
                        <button onclick="window.location.reload()" style="margin-top: 1rem; padding: 0.5rem 1rem; background: #ef4444; color: white; border: none; border-radius: 0.25rem; cursor: pointer;">Reload Application</button>
                    </div>
                `;
            }
        };
    </script>

    <!-- Import Map -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client?deps=react@18.2.0",
        "htm": "https://esm.sh/htm@3.1.1",
        "@google/genai": "https://esm.sh/@google/genai@0.14.1"
      }
    }
    </script>
</head>
<body class="bg-[#1a1a1a] text-white">
    <div id="root">
        <!-- Default Loading State -->
        <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif;">
            <div style="width: 40px; height: 40px; border: 4px solid #333; border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 1rem;"></div>
            <div style="font-size: 1.25rem; font-weight: bold;">Loading Game Scout...</div>
            <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
        </div>
    </div>

    <script type="module">
        import { useState, useEffect, createElement } from 'react';
        import { createRoot } from 'react-dom/client';
        import htm from 'htm';
        import { GoogleGenAI, Type } from "@google/genai";

        const html = htm.bind(createElement);

        // --- CONSTANTS ---
        const Currency = { EUR: 'EUR', USD: 'USD' };
        const Region = { EU_WEST: 'EU West', USA: 'USA' };
        const Theme = {
            AMOLED_RAINBOW: 'Amoled Rainbow',
            AMOLED_WHITE: 'Amoled White',
            CYBERPUNK: 'Cyberpunk',
            WOODEN: 'Wooden',
            UNIVERSE: 'Universe',
            BARBIE: 'Barbie',
            INVERSE_PAPER: 'Inverse Paper',
        };

        const THEME_STYLES = {
            [Theme.AMOLED_WHITE]: {
                bg: 'bg-black', text: 'text-white', panel: 'bg-neutral-900', border: 'border-white/20', accent: 'text-gray-300',
                button: 'bg-white text-black', buttonHover: 'hover:bg-gray-200', input: 'bg-neutral-800 text-white border-white/20',
                tableHeader: 'bg-neutral-800 text-white', rowEven: 'bg-black', rowOdd: 'bg-neutral-900', font: 'font-sans',
                verdictGood: 'text-green-400', verdictBad: 'text-red-400',
            },
            [Theme.AMOLED_RAINBOW]: {
                bg: 'bg-black', text: 'text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-500 to-red-500',
                panel: 'bg-neutral-900 border-l border-pink-500', border: 'border-pink-500/50', accent: 'text-pink-300',
                button: 'bg-gradient-to-r from-purple-600 to-pink-600 text-white', buttonHover: 'hover:from-purple-500 hover:to-pink-500',
                input: 'bg-neutral-800 text-pink-500 border-pink-500/50', tableHeader: 'bg-neutral-900 text-pink-500 border-b border-pink-500',
                rowEven: 'bg-black', rowOdd: 'bg-neutral-900/50', font: 'font-sans tracking-wide', verdictGood: 'text-green-400', verdictBad: 'text-red-400',
            },
            [Theme.CYBERPUNK]: {
                bg: 'bg-yellow-300', text: 'text-black', panel: 'bg-cyan-600 text-black', border: 'border-black', accent: 'text-neutral-800',
                button: 'bg-black text-cyan-400 font-bold uppercase tracking-widest', buttonHover: 'hover:bg-neutral-800',
                input: 'bg-cyan-100 text-black border-black border-2', tableHeader: 'bg-black text-cyan-400 uppercase font-bold',
                rowEven: 'bg-yellow-300', rowOdd: 'bg-yellow-200', font: 'font-mono', verdictGood: 'bg-black text-green-400 px-1', verdictBad: 'bg-black text-red-500 px-1',
            },
            [Theme.WOODEN]: {
                bg: 'bg-[#5D4037]', text: 'text-[#EFEBE9]', panel: 'bg-[#4E342E]', border: 'border-[#8D6E63]', accent: 'text-[#D7CCC8]',
                button: 'bg-[#3E2723] text-[#D7CCC8] border border-[#8D6E63]', buttonHover: 'hover:bg-[#4E342E]',
                input: 'bg-[#3E2723] text-[#D7CCC8] border-[#8D6E63]', tableHeader: 'bg-[#3E2723] text-[#D7CCC8]',
                rowEven: 'bg-[#5D4037]', rowOdd: 'bg-[#4E342E]', font: 'font-serif', verdictGood: 'text-[#C8E6C9]', verdictBad: 'text-[#FFCDD2]',
            },
            [Theme.UNIVERSE]: {
                bg: 'bg-[#0f172a]', text: 'text-blue-100', panel: 'bg-[#1e293b]', border: 'border-blue-500/30', accent: 'text-cyan-300',
                button: 'bg-blue-600 text-white shadow-[0_0_15px_rgba(37,99,235,0.5)]', buttonHover: 'hover:bg-blue-500',
                input: 'bg-[#1e293b] text-blue-100 border-blue-500/30', tableHeader: 'bg-[#172554] text-cyan-200',
                rowEven: 'bg-[#0f172a]', rowOdd: 'bg-[#1e293b]', font: 'font-sans', verdictGood: 'text-cyan-300 shadow-cyan-500/50', verdictBad: 'text-purple-300',
            },
            [Theme.BARBIE]: {
                bg: 'bg-pink-500', text: 'text-white', panel: 'bg-white text-pink-600', border: 'border-white', accent: 'text-pink-100',
                button: 'bg-white text-pink-500 font-bold', buttonHover: 'hover:bg-pink-100',
                input: 'bg-pink-400 text-white placeholder-pink-200 border-white', tableHeader: 'bg-white text-pink-500 font-bold',
                rowEven: 'bg-pink-500', rowOdd: 'bg-pink-600', font: 'font-sans', verdictGood: 'bg-white text-green-500 px-2 rounded-full font-bold', verdictBad: 'bg-white text-red-500 px-2 rounded-full font-bold',
            },
            [Theme.INVERSE_PAPER]: {
                bg: 'bg-white', text: 'text-black', panel: 'bg-gray-100 text-black border-l border-black', border: 'border-black', accent: 'text-gray-700',
                button: 'bg-black text-white border border-black', buttonHover: 'hover:bg-gray-800',
                input: 'bg-white text-black border border-black', tableHeader: 'bg-gray-200 text-black border-b border-black font-bold uppercase',
                rowEven: 'bg-white text-black', rowOdd: 'bg-gray-50 text-black', font: 'font-serif', verdictGood: 'font-bold underline', verdictBad: 'italic text-gray-600',
            },
        };

        const fetchGameData = async (gameName, currency, region) => {
            const ai = new GoogleGenAI({ apiKey: process.env.API_KEY });
            try {
                const response = await ai.models.generateContent({
                    model: "gemini-3-flash-preview",
                    contents: `Analyze the video game "${gameName}". Context: Region ${region}, Currency ${currency}. Get current prices for Steam, Kinguin, and G2A. Also get HowLongToBeat main story time.`,
                    config: {
                        tools: [{ googleSearch: {} }],
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: Type.OBJECT,
                            properties: {
                                name: { type: Type.STRING },
                                hltbTime: { type: Type.STRING },
                                steamPrice: { type: Type.NUMBER },
                                kinguinPrice: { type: Type.NUMBER },
                                g2aPrice: { type: Type.NUMBER },
                                lowestAllTime: { type: Type.NUMBER },
                                isGoodDeal: { type: Type.BOOLEAN },
                                dealVerdict: { type: Type.STRING }
                            },
                            required: ["name", "hltbTime", "steamPrice", "kinguinPrice", "g2aPrice", "lowestAllTime", "isGoodDeal", "dealVerdict"]
                        }
                    },
                });

                if (response.text) {
                    const data = JSON.parse(response.text);
                    return {
                        name: data.name || gameName,
                        hltbTime: data.hltbTime || '?',
                        prices: {
                            steam: data.steamPrice || 0,
                            kinguin: data.kinguinPrice || 0,
                            g2a: data.g2aPrice || 0,
                        },
                        lowestAllTime: data.lowestAllTime || 0,
                        isGoodDeal: data.isGoodDeal || false,
                        dealVerdict: data.dealVerdict || 'Unknown',
                        status: 'success',
                    };
                }
                throw new Error("Empty response");
            } catch (error) {
                console.error("Fetch Error:", error);
                return { name: gameName, status: 'error', dealVerdict: "Search Error" };
            }
        };

        const fetchRecommendations = async (gameList) => {
            if (gameList.length === 0) return [];
            const ai = new GoogleGenAI({ apiKey: process.env.API_KEY });
            try {
                const response = await ai.models.generateContent({
                    model: "gemini-3-flash-preview",
                    contents: `Recommend 5 indie games similar to: ${gameList.join(", ")}. Provide concise reasons why.`,
                    config: { 
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: Type.ARRAY,
                            items: {
                                type: Type.OBJECT,
                                properties: {
                                    name: { type: Type.STRING },
                                    reason: { type: Type.STRING }
                                },
                                required: ["name", "reason"]
                            }
                        }
                    },
                });
                return response.text ? JSON.parse(response.text) : [];
            } catch (e) {
                console.error("Rec Error:", e);
                return [];
            }
        };

        const RefreshIcon = () => html`<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/></svg>`;
        const TrashIcon = () => html`<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`;
        const SettingsIcon = () => html`<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 5 9 1.65 1.65 0 0 0 4.67 7.18l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`;

        const App = () => {
            const [games, setGames] = useState(() => JSON.parse(localStorage.getItem('gpt_games') || '[]'));
            const [settings, setSettings] = useState(() => JSON.parse(localStorage.getItem('gpt_settings') || '{"currency":"EUR","region":"EU West","theme":"Inverse Paper"}'));
            const [recommendations, setRecommendations] = useState([]);
            const [inputName, setInputName] = useState('');
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [isRecLoading, setIsRecLoading] = useState(false);
            const [hasKey, setHasKey] = useState(false);

            const styles = THEME_STYLES[settings.theme] || THEME_STYLES[Theme.INVERSE_PAPER];

            useEffect(() => {
                localStorage.setItem('gpt_games', JSON.stringify(games));
            }, [games]);

            useEffect(() => {
                localStorage.setItem('gpt_settings', JSON.stringify(settings));
            }, [settings]);

            useEffect(() => {
                const checkKey = async () => {
                    if (window.aistudio && window.aistudio.hasSelectedApiKey) {
                        try {
                            const active = await window.aistudio.hasSelectedApiKey();
                            setHasKey(active);
                        } catch (e) {
                            console.error("API Key check failed:", e);
                        }
                    }
                };
                checkKey();
            }, []);

            useEffect(() => {
                const fetchRecs = async () => {
                    if (games.length === 0) { setRecommendations([]); return; }
                    setIsRecLoading(true);
                    setRecommendations(await fetchRecommendations(games.map(g => g.name)));
                    setIsRecLoading(false);
                };
                const t = setTimeout(fetchRecs, 1500);
                return () => clearTimeout(t);
            }, [games.length]);

            const handleAdd = async () => {
                if (!inputName.trim()) return;
                const id = Date.now().toString();
                setGames(p => [...p, { id, name: inputName, status: 'loading', prices: { steam:0, kinguin:0, g2a:0 }, dealVerdict: 'Checking...' }]);
                setInputName('');
                const data = await fetchGameData(inputName, settings.currency, settings.region);
                setGames(p => p.map(g => g.id === id ? { ...g, ...data } : g));
            };

            const handleRefresh = async (id, name) => {
                setGames(p => p.map(g => g.id === id ? { ...g, status: 'loading', dealVerdict: 'Refreshing...' } : g));
                const data = await fetchGameData(name, settings.currency, settings.region);
                setGames(p => p.map(g => g.id === id ? { ...g, ...data } : g));
            };

            const handleOpenKey = async () => {
                if (window.aistudio && window.aistudio.openSelectKey) {
                    await window.aistudio.openSelectKey();
                    // Assume success as per platform guidelines
                    setHasKey(true);
                }
            };

            const formatPrice = (p) => new Intl.NumberFormat(undefined, { style: 'currency', currency: settings.currency }).format(p || 0);

            return html`
                <div className=${`min-h-screen transition-colors duration-300 ${styles.bg} ${styles.text} ${styles.font} p-4 md:p-6`}>
                    <div className="max-w-[1600px] mx-auto grid grid-cols-1 lg:grid-cols-4 gap-6">
                        <div className="lg:col-span-3 space-y-6">
                            <!-- Header -->
                            <div className=${`p-6 rounded-xl shadow-lg ${styles.panel} ${styles.border} border flex flex-col md:flex-row justify-between items-center gap-4`}>
                                <div>
                                    <h1 className=${`text-3xl font-bold ${styles.text}`}>Game Scout</h1>
                                    <p className=${`opacity-70 text-sm mt-1 ${styles.accent}`}>Intelligent Price Tracker & Playtime Estimates</p>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick=${handleOpenKey} className=${`px-4 py-2 rounded-lg text-xs font-bold transition-all shadow-sm ${hasKey ? 'bg-green-600/20 border border-green-500 text-green-400' : 'bg-red-600/20 border border-red-500 text-red-400'}`}>
                                        ${hasKey ? 'AI Studio Key Linked' : 'Link API Key (Required)'}
                                    </button>
                                    <button onClick=${() => setIsSettingsOpen(!isSettingsOpen)} className=${`p-2 rounded-full border shadow-sm ${styles.button} ${styles.buttonHover}`}><${SettingsIcon} /></button>
                                </div>
                            </div>

                            <!-- Settings -->
                            ${isSettingsOpen ? html`
                                <div className=${`p-6 rounded-xl shadow-inner mb-6 border ${styles.border} ${styles.panel} animate-in fade-in slide-in-from-top-2 duration-300`}>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <div>
                                            <label className="block text-xs uppercase tracking-wider mb-2 opacity-60 font-bold">Interface Theme</label>
                                            <select value=${settings.theme} onChange=${e => setSettings({...settings, theme: e.target.value})} className=${`w-full p-2 rounded border focus:ring-2 focus:ring-white/20 outline-none ${styles.input}`}>
                                                ${Object.values(Theme).map(t => html`<option key=${t} value=${t}>${t}</option>`)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs uppercase tracking-wider mb-2 opacity-60 font-bold">Preferred Currency</label>
                                            <select value=${settings.currency} onChange=${e => setSettings({...settings, currency: e.target.value})} className=${`w-full p-2 rounded border focus:ring-2 focus:ring-white/20 outline-none ${styles.input}`}>
                                                <option value="EUR">EUR (€)</option><option value="USD">USD ($)</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs uppercase tracking-wider mb-2 opacity-60 font-bold">Shopping Region</label>
                                            <select value=${settings.region} onChange=${e => setSettings({...settings, region: e.target.value})} className=${`w-full p-2 rounded border focus:ring-2 focus:ring-white/20 outline-none ${styles.input}`}>
                                                <option value="EU West">EU West</option><option value="USA">USA</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="mt-4 p-4 rounded-lg bg-black/30 text-[11px] leading-relaxed border border-white/5">
                                        <p className="font-bold mb-1">Configuration Note:</p>
                                        <p>Click the "Link API Key" button above to select your Google AI Studio project. This allows Game Scout to perform real-time price searches. 
                                        Requires a project with <a href="https://ai.google.dev/gemini-api/docs/billing" target="_blank" className="underline hover:text-white transition-colors">Billing enabled</a>.</p>
                                    </div>
                                </div>
                            `: null}

                            <!-- Input -->
                            <div className="flex gap-2">
                                <input 
                                    type="text" value=${inputName} onChange=${e => setInputName(e.target.value)} onKeyDown=${e => e.key === 'Enter' && handleAdd()}
                                    placeholder="Search for a game (e.g. Hades II, Elden Ring)..." className=${`flex-1 p-4 rounded-lg outline-none border shadow-inner ${styles.input} text-lg transition-all focus:ring-2 focus:ring-offset-2 focus:ring-offset-black focus:ring-white/10`}
                                />
                                <button onClick=${handleAdd} className=${`px-10 rounded-lg font-bold shadow-md active:scale-95 transition-all ${styles.button} ${styles.buttonHover}`}>Add Game</button>
                            </div>

                            <!-- Table -->
                            <div className=${`overflow-x-auto rounded-xl border shadow-2xl ${styles.border} backdrop-blur-sm`}>
                                <table className="w-full text-left border-collapse min-w-[800px]">
                                    <thead>
                                        <tr className=${`${styles.tableHeader} border-b ${styles.border}`}>
                                            <th className="p-4 text-xs uppercase tracking-widest font-bold">Game Title</th>
                                            <th className="p-4 text-center text-xs uppercase tracking-widest font-bold">HLTB Time</th>
                                            <th className="p-4 text-right text-xs uppercase tracking-widest font-bold">Steam</th>
                                            <th className="p-4 text-right text-xs uppercase tracking-widest font-bold">Kinguin</th>
                                            <th className="p-4 text-right text-xs uppercase tracking-widest font-bold">G2A</th>
                                            <th className="p-4 text-center text-xs uppercase tracking-widest font-bold">Verdict</th>
                                            <th className="p-4 text-center text-xs uppercase tracking-widest font-bold">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${games.length === 0 ? html`<tr><td colSpan="7" className=${`p-12 text-center opacity-40 italic ${styles.rowEven}`}>Your wishlist is empty. Start by searching for your next favorite game.</td></tr>` : games.map((g, i) => html`
                                            <tr key=${g.id} className=${`border-b border-opacity-5 ${styles.border} ${i % 2 === 0 ? styles.rowEven : styles.rowOdd} hover:bg-white/5 transition-colors`}>
                                                <td className="p-4 font-bold">
                                                    <div className="flex flex-col">
                                                        <span>${g.name}</span>
                                                        <span className="text-[10px] opacity-40 font-normal uppercase mt-0.5">Historical Low: ${formatPrice(g.lowestAllTime)}</span>
                                                    </div>
                                                </td>
                                                <td className="p-4 text-center text-sm opacity-70">${g.hltbTime}</td>
                                                <td className="p-4 text-right">
                                                    <a href="https://store.steampowered.com/search/?term=${encodeURIComponent(g.name)}" target="_blank" className="hover:underline decoration-white/30 underline-offset-4">
                                                        ${g.status === 'loading' ? '...' : formatPrice(g.prices.steam)}
                                                    </a>
                                                </td>
                                                <td className="p-4 text-right font-mono text-xs">${g.status === 'loading' ? '...' : formatPrice(g.prices.kinguin)}</td>
                                                <td className="p-4 text-right font-mono text-xs">${g.status === 'loading' ? '...' : formatPrice(g.prices.g2a)}</td>
                                                <td className="p-4 text-center">
                                                    ${g.status === 'loading' ? html`<span className="animate-pulse opacity-40 text-xs tracking-tighter uppercase font-bold">Analyzing...</span>` : html`
                                                        <span className=${`text-[10px] px-2 py-0.5 rounded border-2 font-black uppercase tracking-widest ${g.isGoodDeal ? 'border-green-500/50 bg-green-500/10 ' + styles.verdictGood : 'border-red-500/30 bg-red-500/5 opacity-60 ' + styles.verdictBad}`}>
                                                            ${g.dealVerdict}
                                                        </span>
                                                    `}
                                                </td>
                                                <td className="p-4 text-center">
                                                    <div className="flex justify-center gap-1">
                                                        <button onClick=${() => handleRefresh(g.id, g.name)} disabled=${g.status === 'loading'} title="Refresh data" className="p-2 hover:bg-white/10 rounded-full transition-all active:scale-90"><${RefreshIcon}/></button>
                                                        <button onClick=${() => setGames(prev => prev.filter(x => x.id !== g.id))} title="Remove game" className="p-2 hover:bg-red-500/10 hover:text-red-400 rounded-full transition-all active:scale-90"><${TrashIcon}/></button>
                                                    </div>
                                                </td>
                                            </tr>
                                        `)}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Sidebar -->
                        <div className="lg:col-span-1">
                            <div className=${`sticky top-6 p-6 rounded-xl shadow-2xl h-fit border ${styles.panel} ${styles.border} backdrop-blur-md`}>
                                <h2 className=${`text-lg font-black mb-4 uppercase tracking-tighter ${styles.accent}`}>Indie Spotlight</h2>
                                ${isRecLoading ? html`<div className="space-y-4">
                                    <div className="h-20 bg-white/5 animate-pulse rounded-lg"></div>
                                    <div className="h-20 bg-white/5 animate-pulse rounded-lg"></div>
                                </div>` : recommendations.length > 0 ? html`
                                    <ul className="space-y-3">
                                        ${recommendations.map((r, i) => html`<li key=${i} className=${`p-3.5 rounded-lg border border-opacity-10 ${styles.border} ${styles.rowOdd} group hover:bg-white/5 transition-all cursor-default`}>
                                            <div className="font-bold text-sm mb-1 group-hover:text-white transition-colors underline decoration-transparent group-hover:decoration-current">${r.name}</div>
                                            <div className="text-[11px] opacity-60 leading-snug font-medium italic">${r.reason}</div>
                                        </li>`)}
                                    </ul>
                                ` : html`<div className="text-center opacity-30 text-xs py-10 border-2 border-dashed ${styles.border} rounded-xl">
                                    Add games to wishlist to receive tailored indie discovery picks.
                                </div>`}
                                
                                <div className="mt-8 pt-6 border-t border-white/5">
                                    <div className="text-[10px] opacity-40 font-bold uppercase tracking-widest mb-2">Powered By</div>
                                    <div className="flex items-center gap-2 opacity-60">
                                        <div className="w-2 h-2 rounded-full bg-blue-500 shadow-[0_0_8px_blue]"></div>
                                        <span className="text-xs font-mono">Gemini 3 Flash</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        };

        const root = createRoot(document.getElementById('root'));
        root.render(html`<${App} />`);
    </script>
</body>
</html>
